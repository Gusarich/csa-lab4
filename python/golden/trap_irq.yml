in_source: |
  .section .vectors
  .word _start
  .word irq_input
  .space 56

  .section .text
  _start:
      ei
  loop:
      j loop

  irq_input:
      in a0, IN_STATUS
      andi a0, a0, 1
      beq a0, zero, irq_done
      in a0, IN_DATA
      out OUT_DATA, a0
  irq_done:
      iret
in_input_schedule: |
  200 'Q'
in_args:
  max_ticks: 500
in_log_patterns:
- state=IRQ_ENTER
- state=IRQ_VECTOR
- src='in a0, IN_DATA' port=in 0x0001 -> 0x00000051
- src='out OUT_DATA, a0' port=out 0x0011 <- 0x00000051
out_ticks: 500
out_stop_reason: STOP_TICK_LIMIT
out_stdout: Q
out_listing: |-
  000000 - 0x00000040 - .word 64
  000004 - 0x00000048 - .word 72
  000008 - 0x00000000 - .word 0
  00000C - 0x00000000 - .word 0
  000010 - 0x00000000 - .word 0
  000014 - 0x00000000 - .word 0
  000018 - 0x00000000 - .word 0
  00001C - 0x00000000 - .word 0
  000020 - 0x00000000 - .word 0
  000024 - 0x00000000 - .word 0
  000028 - 0x00000000 - .word 0
  00002C - 0x00000000 - .word 0
  000030 - 0x00000000 - .word 0
  000034 - 0x00000000 - .word 0
  000038 - 0x00000000 - .word 0
  00003C - 0x00000000 - .word 0
  000040 - 0x60000000 - ei
  000044 - 0x40000044 - j 0x000044
  000048 - 0x50100000 - in a0, 0x0000
  00004C - 0x11110001 - andi a0, a0, 1
  000050 - 0x30100008 - beq a0, zero, 8
  000054 - 0x50100001 - in a0, 0x0001
  000058 - 0x51100011 - out 0x0011, a0
  00005C - 0x62000000 - iret
out_code_base64: 
  TDRNQwABAAIAAAAAAAAAQAAAAAAAAABAAAAASAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAACAAAAABYAAAAEAAAERQEAAAEREAATAQAAhQEAABURAAEWIAAAA=
