name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/*"
      - "python/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/*"
      - "python/**"

defaults:
  run:
    working-directory: ./python

jobs:
  test:
    runs-on: [self-hosted, linux, x64, csa-lab4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests and collect coverage
        run: |
          uv run coverage run -m pytest .
          uv run coverage report -m
        env:
          CI: true

  lint:
    runs-on: [self-hosted, linux, x64, csa-lab4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting with Ruff
        run: uv run ruff format --check .

      - name: Run Ruff linters
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .
