      .word 0x00000000, 0x000186A0
      .word 0x00000000, 0x00002710
      .word 0x00000000, 0x000003E8
      .word 0x00000000, 0x00000064
      .word 0x00000000, 0x0000000A
      .word 0x00000000, 0x00000001

  .section .data
  rx_head:
      .word 0
  rx_tail:
      .word 0
  rx_count:
      .word 0
  rx_flags:
      .word 0
  input_error:
      .word 0
  expected_count:
      .word 0
  sort_count:
      .word 0
  print_index:
      .word 0
  numbers:
      .space 128
  line_buf:
      .space 1028

  .section .bss
  rx_buf:
      .space 512
