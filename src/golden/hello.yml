in_source: |
  .section .vectors
  .word _start
  .word 0
  .space 56

  .section .text
  _start:
      la a0, msg
      call puts_pstr
      halt

  puts_pstr:
      lw t0, 0(a0)
      addi t1, a0, 4
  puts_loop:
      beq t0, zero, puts_done
      lw t2, 0(t1)
      out OUT_DATA, t2
      addi t1, t1, 4
      addi t0, t0, -1
      j puts_loop
  puts_done:
      ret

  .section .rodata
  msg:
      .pstr "hello world\n"
in_args:
  max_ticks: 1000
in_log_patterns:
- src='la a0, msg'
- src='lw t0, 0(a0)'
- src='out OUT_DATA, t2' port=out 0x0011 <- 0x00000068
- stop=HALT
