in_source: |
  .section .vectors
  .word _start
  .word 0
  .space 56

  .section .text
  _start:
      la t0, slot0
      la t1, slot1
      li a0, 'Z'
      sw a0, 0(t0)
      sw a0, 0(t1)
      lw a1, 0(t0)
      out OUT_DATA, a1
      halt

  .section .data
  .org 0x000400
  slot0:
      .word 'A'
  .org 0x000500
  slot1:
      .word 'B'
