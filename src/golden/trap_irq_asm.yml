in_source: |
  .section .vectors
  .word _start
  .word irq_input
  .space 56

  .section .text
  _start:
      ei
  loop:
      j loop

  irq_input:
      in a0, IN_STATUS
      andi a0, a0, 1
      beq a0, zero, irq_done
      in a0, IN_DATA
      out OUT_DATA, a0
  irq_done:
      iret
in_stdin: |-
  200 'Q'
in_max_ticks: 500
out_code: !!binary |
  TDRNQwABAAIAAAAAAAAAQAAAAAAAAABAAAAASAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAACAAAAABYAAAAEAAAERQEAAAEREAATAQ
  AAhQEAABURAAEWIAAAA=
