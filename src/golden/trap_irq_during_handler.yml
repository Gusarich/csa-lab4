in_source: |
  .section .vectors
  .word _start
  .word irq_input
  .space 56

  .section .text
  _start:
      ei
  loop:
      j loop

  irq_input:
      in a0, IN_DATA
      out OUT_DATA, a0
      nop
      nop
      nop
      iret
in_input_schedule: |
  200 'A'
  251 'B'
in_args:
  max_ticks: 420
