[project]
name = "csa-lab4"
version = "0.1.0"
description = "Assembler and tick-accurate processor model for CSA lab 4."
authors = [{ name = "Daniil Sedov" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.2.7",
    "mypy>=1.4.1",
    "pytest==7.4.3",
    "pytest-golden==0.2.2",
    "ruff>=0.1.3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
enable_assertion_pass_hook = true
addopts = "--doctest-modules"
log_format = "%(levelname)-7s %(module)s:%(funcName)-13s %(message)s"

[tool.ruff]
line-length = 120
src = ["."]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "N",
    "I",
    "C90",
    "UP",
    "ERA",
    "YTT",
    "ASYNC",
    "A",
    "FA",
    "ICN",
    "INP",
    "T20",
    "PT",
    "Q",
    "RET",
    "PTH",
    "PD",
    "TRY",
    "RUF",
]
unfixable = [
    "ERA001",
]

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.mypy]
strict = true
